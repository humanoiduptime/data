name: Publish public data release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate tagged release
        run: |
          node scripts/validate.mjs
          test "$(git tag --points-at HEAD | grep -Fx "$RELEASE_TAG")" = "$RELEASE_TAG"
          test "$(node -p "require('./data/latest-release-manifest.json').releaseTag")" = "$RELEASE_TAG"
      - name: Resolve release assets
        id: release
        run: |
          node --input-type=module -e "import { appendFileSync, readFileSync } from 'node:fs'; const m=JSON.parse(readFileSync('data/latest-release-manifest.json')); const base='humanoiduptime-public-data-v'+m.exportVersion+'-'+m.snapshotDate; appendFileSync(process.env.GITHUB_OUTPUT, 'version='+m.exportVersion+'\nbase='+base+'\n');"
      - name: Create immutable GitHub Release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BASE: ${{ steps.release.outputs.base }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "HumanoidUptime Public Data v$RELEASE_VERSION" \
            --notes-file "releases/$RELEASE_TAG.md" \
            "data/$RELEASE_BASE.json" \
            "data/$RELEASE_BASE-csv.zip" \
            "data/$RELEASE_BASE-release-manifest.json" \
            "data/$RELEASE_BASE-release-checksums.sha256"
